name: futurestack
x-api: &api
  image: ${FS_API_IMAGE:-futurestack-api:local}
  build:
    context: .
    dockerfile: Dockerfile.api
  env_file: .env
  environment:
    FS_DATABASE_URL: postgresql+psycopg://futurestack:${POSTGRES_PASSWORD:?Run python scripts/init_env.py}@db:5432/futurestack
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: futurestack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py}
      POSTGRES_DB: futurestack
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futurestack -d futurestack"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *api
    depends_on:
      db: {condition: service_healthy}
    command: ["alembic","upgrade","head"]
    restart: "no"
  api:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
    ports: ["127.0.0.1:${FS_API_PORT:-8000}:8000"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    image: ${FS_WEB_IMAGE:-futurestack-web:local}
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      FS_API_URL: http://api:8000
      FS_WORKSPACE_TOKEN: ${FS_WORKSPACE_TOKEN:?Run python scripts/init_env.py}
    depends_on:
      api: {condition: service_healthy}
    ports: ["127.0.0.1:${FS_WEB_PORT:-3000}:3000"]
    restart: unless-stopped
volumes:
  database:
