name: Verify
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: local_ci
          POSTGRES_DB: lab
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U lab" --health-interval=3s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: constraints.txt}
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: pip install -c constraints.txt '.[oci,dev]' playwright
      - run: pytest -q
        env:
          FS_TEST_POSTGRES: postgresql+psycopg://lab:local_ci@localhost:5432/lab
      - run: python -m evaluation.run --output results.json
      - run: npm ci && npm run build
        working-directory: web
        env: {NEXT_TELEMETRY_DISABLED: "1"}
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/smoke_browser.py
      - run: python scripts/init_env.py && docker compose config --quiet && docker compose up --build -d --wait
      - run: curl --fail --retry 12 --retry-connrefused http://localhost:3000/api/lab/config
      - if: always()
        run: docker compose down
      - uses: actions/upload-artifact@v4
        with: {name: paired-evaluation, path: results.json}
